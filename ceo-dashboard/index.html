<!doctype html>
<html lang="en">
  <head>
<script id="ts-gate">
(function(){
  var PASS_HASH = "41db44e6bb0a6aba87266c6bb18516161847df41c8e33193fb59e696537512d8";
  var STORAGE_KEY = "ts_hub_auth_v1";
  if (localStorage.getItem(STORAGE_KEY) === PASS_HASH) return;

  document.write('<style id="ts-gate-style">html{visibility:hidden !important}</style>');

  function sha256(str){
    var enc = new TextEncoder().encode(str);
    return crypto.subtle.digest("SHA-256", enc).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf), function(b){return b.toString(16).padStart(2,"0");}).join("");
    });
  }

  function showGate(){
    var overlay = document.createElement('div');
    overlay.id = 'ts-gate-overlay';
    overlay.style.cssText = 'position:fixed;inset:0;z-index:999999;background:#05070d;color:#f3f6fc;display:flex;align-items:center;justify-content:center;font-family:"Inter",system-ui,-apple-system,sans-serif;visibility:visible;';
    overlay.innerHTML =
      '<form id="ts-gate-form" style="text-align:center;max-width:320px;width:90%;">' +
        '<div style="font-size:15px;font-weight:700;letter-spacing:0.02em;margin-bottom:6px;">TerraSlate</div>' +
        '<div style="font-size:13px;color:#a7b2c8;margin-bottom:22px;">Enter the access code to continue</div>' +
        '<input id="ts-gate-input" type="password" autocomplete="off" placeholder="Access code" style="width:100%;padding:12px 14px;border-radius:9px;border:1px solid rgba(255,255,255,0.14);background:#0d1220;color:#f3f6fc;font-size:14px;box-sizing:border-box;outline:none;" />' +
        '<div id="ts-gate-error" style="color:#ff6b6b;font-size:12.5px;margin-top:10px;min-height:16px;"></div>' +
        '<button type="submit" style="margin-top:14px;width:100%;padding:12px;border-radius:9px;border:none;background:#3b9eff;color:#05070d;font-weight:700;font-size:14px;cursor:pointer;">Enter</button>' +
      '</form>';
    document.body.appendChild(overlay);
    document.documentElement.style.visibility = 'visible';
    var input = document.getElementById('ts-gate-input');
    var errorEl = document.getElementById('ts-gate-error');
    input.focus();
    document.getElementById('ts-gate-form').addEventListener('submit', function(e){
      e.preventDefault();
      sha256(input.value).then(function(hash){
        if (hash === PASS_HASH) {
          localStorage.setItem(STORAGE_KEY, hash);
          overlay.remove();
          var hideStyle = document.getElementById('ts-gate-style');
          if (hideStyle) hideStyle.remove();
        } else {
          errorEl.textContent = 'Incorrect code — try again.';
          input.value = '';
          input.focus();
        }
      });
    });
  }

  if (document.body) { showGate(); }
  else { document.addEventListener('DOMContentLoaded', showGate); }
})();
</script>
